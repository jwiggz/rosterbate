<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RosterBate - Sleeper Basketball</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="global-nav.css">
<style>
:root{--bg:#0a0e1a;--panel:#111827;--card:#161d2e;--border:#263449;--accent:#ff8a2b;--green:#4de0a4;--red:#ef4444;--text:#f7f4ee;--muted:#91a1b5;--fd:'Teko',sans-serif;--fb:'IBM Plex Sans',sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#162032 0,#0a0e1a 40%);color:var(--text);font-family:var(--fb);min-height:100vh}a{color:inherit}.wrap{max-width:1280px;margin:0 auto;padding:24px}.hero{display:flex;gap:18px;align-items:end;justify-content:space-between;margin-bottom:18px}.eyebrow{font-family:var(--fd);color:var(--accent);font-weight:700;letter-spacing:.12em;text-transform:uppercase}.hero h1{font:700 clamp(34px,5vw,62px)/.95 var(--fd);margin:4px 0}.hero p{margin:0;color:var(--muted)}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls input,.controls select,.controls button{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font:600 14px var(--fb)}.controls input{width:230px}.controls button{background:var(--accent);border-color:var(--accent);cursor:pointer}.status{margin:14px 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.matchup{background:linear-gradient(180deg,#171f31,#111827);border:1px solid var(--border);border-radius:16px;overflow:hidden}.matchup-head{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--border)}.team{text-align:left}.team.right{text-align:right}.team-name{font:700 22px/1 var(--fd)}.owner{color:var(--muted);font-size:12px}.score{font:700 34px/1 var(--fd);color:var(--green);text-align:center}.vs{display:block;color:var(--muted);font:600 12px var(--fb);margin-top:3px}.rows{display:grid;grid-template-columns:1fr 1fr}.roster{padding:12px}.roster+.roster{border-left:1px solid var(--border)}.section-title{font:700 14px var(--fd);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}.player{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.055)}.player:last-child{border-bottom:0}.player-main{min-width:0}.player-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-meta{font-size:11px;color:var(--muted)}.pts{font:700 18px var(--fd)}.bench .player{opacity:.72}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.stat-value{font:700 28px var(--fd);margin-top:4px}.standings{margin-top:18px;background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden}.standings h2{font:700 24px var(--fd);margin:0;padding:14px 16px;border-bottom:1px solid var(--border)}.standing-row{display:grid;grid-template-columns:40px minmax(0,1fr) 90px 110px;gap:10px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.055);align-items:center}.standing-row:last-child{border-bottom:0}.rank{font:700 20px var(--fd);color:var(--accent)}.record,.pf{text-align:right}.error{background:#3a1720;border:1px solid #7f1d1d;color:#fecaca;border-radius:12px;padding:12px}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:850px){.hero{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:14px}.rows{grid-template-columns:1fr}.roster+.roster{border-left:0;border-top:1px solid var(--border)}.standing-row{grid-template-columns:30px minmax(0,1fr) 70px 85px}.matchup-head{gap:6px}.team-name{font-size:18px}.score{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div>
      <div class="eyebrow">Sleeper Basketball</div>
      <h1 id="leagueName">Fantasy League Dashboard</h1>
      <p id="leagueMeta">Live Sleeper rosters, matchup scores and player fantasy points.</p>
    </div>
    <div class="controls">
      <input id="leagueInput" aria-label="Sleeper league id" value="1411477732390400000">
      <select id="weekSelect" aria-label="Week"></select>
      <button id="loadBtn">Load league</button>
    </div>
  </section>
  <div id="status" class="status">Loading Sleeper league…</div>
  <section id="summary" class="summary" hidden></section>
  <section id="matchups" class="grid"></section>
  <section id="standings" class="standings" hidden></section>
</div>
<script>
const DEFAULT_LEAGUE='1411477732390400000';
const els={leagueName:document.getElementById('leagueName'),leagueMeta:document.getElementById('leagueMeta'),leagueInput:document.getElementById('leagueInput'),weekSelect:document.getElementById('weekSelect'),loadBtn:document.getElementById('loadBtn'),status:document.getElementById('status'),summary:document.getElementById('summary'),matchups:document.getElementById('matchups'),standings:document.getElementById('standings')};
let currentData=null;
function esc(value){return String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
function num(value,digits=1){const n=Number(value);return Number.isFinite(n)?n.toFixed(digits):'0.0';}
function teamFor(rosterId){return currentData.teams.find(t=>Number(t.roster_id)===Number(rosterId));}
function playerFor(id){return currentData.players[String(id)]||{full_name:`Player ${id}`,team:'',position:''};}
function matchupPlayerRows(matchup,starterMode){
  const ids=starterMode?(matchup.starters||[]).filter(id=>String(id)!=='0'):(matchup.players||[]).filter(id=>!(matchup.starters||[]).map(String).includes(String(id)));
  if(!ids.length)return '<div class="empty">No players</div>';
  return ids.map(id=>{const p=playerFor(id);const pts=(matchup.players_points||{})[id]??(matchup.players_points||{})[String(id)]??0;return `<div class="player"><div class="player-main"><div class="player-name">${esc(p.full_name)}</div><div class="player-meta">${esc([p.team,p.position].filter(Boolean).join(' · '))}</div></div><div class="pts">${num(pts)}</div></div>`}).join('');
}
function renderSummary(){
  const ms=currentData.matchups||[];
  const total=ms.reduce((s,m)=>s+Number(m.points||0),0);
  const high=ms.reduce((best,m)=>Number(m.points||0)>Number(best.points||0)?m:best,ms[0]||{points:0});
  const highTeam=teamFor(high.roster_id);
  const locked=ms.reduce((s,m)=>s+(m.starters||[]).filter(id=>String(id)!=='0').length,0);
  els.summary.innerHTML=`<div class="stat"><div class="stat-label">Teams</div><div class="stat-value">${currentData.teams.length}</div></div><div class="stat"><div class="stat-label">Week</div><div class="stat-value">${currentData.week}</div></div><div class="stat"><div class="stat-label">Highest score</div><div class="stat-value">${num(high.points)}</div><div class="player-meta">${esc(highTeam?.team_name||'')}</div></div><div class="stat"><div class="stat-label">Locked slots</div><div class="stat-value">${locked}</div></div>`;
  els.summary.hidden=false;
}
function renderMatchups(){
  const grouped=new Map();
  for(const m of currentData.matchups||[]){const key=m.matchup_id==null?`solo-${m.roster_id}`:String(m.matchup_id);if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(m)}
  els.matchups.innerHTML=[...grouped.values()].map(group=>{
    const a=group[0],b=group[1];const ta=teamFor(a?.roster_id)||{};const tb=teamFor(b?.roster_id)||{};
    const roster=(m,t,side)=>m?`<div class="roster ${side}"><div class="section-title">Starters / Locked</div>${matchupPlayerRows(m,true)}<div class="section-title" style="margin-top:12px">Bench / Other Games</div><div class="bench">${matchupPlayerRows(m,false)}</div></div>`:'<div class="roster"><div class="empty">Bye</div></div>';
    return `<article class="matchup"><div class="matchup-head"><div class="team"><div class="team-name">${esc(ta.team_name||'Team')}</div><div class="owner">${esc(ta.display_name||'')}</div></div><div class="score">${num(a?.points||0)}<span class="vs">VS</span>${num(b?.points||0)}</div><div class="team right"><div class="team-name">${esc(tb.team_name||'Bye')}</div><div class="owner">${esc(tb.display_name||'')}</div></div></div><div class="rows">${roster(a,ta,'left')}${roster(b,tb,'right')}</div></article>`;
  }).join('')||'<div class="empty">No matchups returned for this week.</div>';
}
function renderStandings(){
  const rows=(currentData.teams||[]).slice().sort((a,b)=>{const aw=Number(a.settings?.wins||0),bw=Number(b.settings?.wins||0);if(bw!==aw)return bw-aw;return Number(b.settings?.fpts||0)-Number(a.settings?.fpts||0)});
  els.standings.innerHTML=`<h2>League standings</h2>${rows.map((t,i)=>{const s=t.settings||{};const fpts=Number(s.fpts||0)+(Number(s.fpts_decimal||0)/100);return `<div class="standing-row"><div class="rank">${i+1}</div><div><strong>${esc(t.team_name)}</strong><div class="player-meta">${esc(t.display_name)}</div></div><div class="record">${Number(s.wins||0)}-${Number(s.losses||0)}${Number(s.ties||0)?'-'+Number(s.ties):''}</div><div class="pf">${num(fpts)} PF</div></div>`}).join('')}`;
  els.standings.hidden=false;
}
function setWeekOptions(selected,maxWeek){const max=Math.max(26,Number(maxWeek)||26);els.weekSelect.innerHTML=Array.from({length:max},(_,i)=>`<option value="${i+1}" ${i+1===Number(selected)?'selected':''}>Week ${i+1}</option>`).join('')}
async function load(){
  const league=String(els.leagueInput.value||DEFAULT_LEAGUE).trim();const week=Number(els.weekSelect.value)||0;
  els.status.className='status';els.status.textContent='Loading Sleeper league…';els.matchups.innerHTML='';els.summary.hidden=true;els.standings.hidden=true;els.loadBtn.disabled=true;
  try{
    const qs=new URLSearchParams({league});if(week)qs.set('week',week);
    const res=await fetch(`/.netlify/functions/sleeper-basketball?${qs}`);const data=await res.json();if(!res.ok)throw new Error(data.error||'Unable to load league');
    currentData=data;els.leagueName.textContent=data.league.name||'Sleeper Basketball';els.leagueMeta.textContent=`${data.league.season||''} · ${data.teams.length} teams · Week ${data.week}`;setWeekOptions(data.week,data.league.settings?.playoff_week_start||26);renderSummary();renderMatchups();renderStandings();els.status.textContent=`Updated from Sleeper · Week ${data.week}`;
    const url=new URL(location.href);url.searchParams.set('league',league);url.searchParams.set('week',data.week);history.replaceState({},'',url);
  }catch(error){els.status.className='error';els.status.textContent=error.message||String(error)}finally{els.loadBtn.disabled=false}
}
els.loadBtn.addEventListener('click',load);els.weekSelect.addEventListener('change',load);
const params=new URLSearchParams(location.search);els.leagueInput.value=params.get('league')||DEFAULT_LEAGUE;setWeekOptions(Number(params.get('week'))||1,26);load();
</script>
</body>
</html>
