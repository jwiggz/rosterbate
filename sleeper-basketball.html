<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="RosterBate Sleeper basketball league dashboard and lock-in analytics.">
<title>RosterBate — Sleeper Basketball</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a11;--panel:#101825;--panel2:#17243b;--card:#111a2a;--border:#263b5c;--orange:#f7a457;--orange2:#f97316;--blue:#5aa8ff;--green:#6fe1a1;--red:#ef4444;--text:#f4f7fb;--muted:#8fa1bb;--muted2:#5e708a;--fd:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;--fm:'Manrope',sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05070b;color:var(--text);font-family:var(--fb)}body{background:radial-gradient(70% 34% at 50% 0%,rgba(91,121,170,.15),transparent 62%),linear-gradient(180deg,#0d131d,#070a11 55%,#05070b)}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(24% 26% at 4% 22%,rgba(255,255,255,.07),transparent 70%),radial-gradient(24% 26% at 96% 22%,rgba(255,255,255,.07),transparent 70%);filter:blur(18px)}a{color:inherit;text-decoration:none}.site-nav{height:50px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:relative;z-index:2;background:rgba(6,10,16,.42);backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:10px;font:900 18px var(--fd);text-transform:uppercase;letter-spacing:.5px}.brand img{height:54px;width:auto;display:block}.back-home{padding:7px 12px;border:1px solid rgba(255,255,255,.15);border-radius:10px;background:linear-gradient(180deg,#424b5c,#29303d);font:800 12px var(--fd);text-transform:uppercase;letter-spacing:.45px}.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:28px 24px 54px}.hero-shell{padding:24px;border:1px solid rgba(247,164,87,.26);border-radius:22px;background:radial-gradient(100% 130% at 0 0,rgba(90,168,255,.12),transparent 48%),linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.025) 42%,rgba(8,15,27,.18)),linear-gradient(180deg,#17243b,#0f1726);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 24px 55px rgba(0,0,0,.32),0 0 34px rgba(247,164,87,.07)}.hero{display:flex;gap:24px;align-items:flex-end;justify-content:space-between}.eyebrow{font:800 12px var(--fd);letter-spacing:.11em;text-transform:uppercase;color:var(--orange)}.hero h1{font:900 clamp(38px,6vw,66px)/.88 var(--fd);text-transform:uppercase;letter-spacing:.2px;margin:5px 0 9px}.hero p{margin:0;color:#c4d0e1;font:600 14px/1.45 var(--fm)}.controls{display:grid;grid-template-columns:minmax(190px,1fr) auto;gap:8px;min-width:min(100%,390px)}.controls input,.controls select,.controls button{min-height:44px;border-radius:12px;font:800 13px var(--fd);text-transform:uppercase;letter-spacing:.35px}.controls input,.controls select{background:#101827;border:1px solid #30425e;color:var(--text);padding:0 12px}.controls input{grid-column:1/-1}.controls button{border:1px solid rgba(255,220,179,.48);background:linear-gradient(180deg,#ffbd70,#f28721 72%,#db6e14);color:#2b1708;padding:0 19px;cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,240,217,.9),0 10px 20px rgba(0,0,0,.26)}.status{margin:12px 2px 0;color:var(--muted);font-size:12px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat{padding:14px 15px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:linear-gradient(180deg,rgba(29,44,70,.92),rgba(13,21,35,.96));box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 12px 24px rgba(0,0,0,.18)}.stat-label{font:800 11px var(--fd);text-transform:uppercase;letter-spacing:.75px;color:var(--muted)}.stat-value{font:900 32px/.95 var(--fd);color:#fff;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.matchup{border:1px solid rgba(90,168,255,.2);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#17243b,#0e1624);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 16px 30px rgba(0,0,0,.24)}.matchup-head{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:15px;background:linear-gradient(180deg,rgba(67,100,153,.2),rgba(20,31,50,.16));border-bottom:1px solid rgba(255,255,255,.08)}.team{text-align:left;min-width:0}.team.right{text-align:right}.team-name{font:900 22px/.95 var(--fd);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.owner{font-size:11px;color:var(--muted);margin-top:4px}.score{font:900 31px/.9 var(--fd);color:#fff;text-align:center;min-width:96px}.score .leader{color:var(--green)}.vs{display:block;font:800 10px var(--fd);letter-spacing:.8px;color:var(--orange);margin:5px 0}.rows{display:grid;grid-template-columns:1fr 1fr}.roster{padding:12px 13px}.roster+.roster{border-left:1px solid rgba(255,255,255,.08)}.section-title{font:800 11px var(--fd);letter-spacing:.78px;text-transform:uppercase;color:var(--orange);margin:2px 0 7px}.player{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.055)}.player:last-child{border-bottom:0}.player-main{min-width:0}.player-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-meta{font-size:10px;color:var(--muted);margin-top:2px}.pts{font:900 19px var(--fd);color:#eaf1fb}.bench .player{opacity:.62}.standings{margin-top:17px;border:1px solid rgba(247,164,87,.25);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#17243b,#0e1624);box-shadow:0 16px 30px rgba(0,0,0,.24)}.standings h2{font:900 26px var(--fd);text-transform:uppercase;margin:0;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08)}.standing-row{display:grid;grid-template-columns:38px minmax(0,1fr) 90px 108px;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.055)}.standing-row:last-child{border-bottom:0}.rank{font:900 20px var(--fd);color:var(--orange)}.record,.pf{text-align:right;font:800 14px var(--fd)}.error{margin:14px 0;padding:12px;border-radius:12px;background:#35151c;border:1px solid #7f1d1d;color:#fecaca}.empty{padding:18px;text-align:center;color:var(--muted);font-size:12px}.footer-note{margin-top:18px;text-align:center;color:var(--muted2);font-size:11px}.footer-note strong{color:var(--muted)}@media(max-width:860px){.hero{align-items:flex-start;flex-direction:column}.controls{width:100%;min-width:0}.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.site-nav{padding:0 14px}.brand span{display:none}.wrap{padding:18px 12px 40px}.hero-shell{padding:16px}.controls{grid-template-columns:1fr}.controls input{grid-column:auto}.rows{grid-template-columns:1fr}.roster+.roster{border-left:0;border-top:1px solid rgba(255,255,255,.08)}.standing-row{grid-template-columns:28px minmax(0,1fr) 64px 80px}.matchup-head{padding:12px 10px}.team-name{font-size:18px}.score{font-size:26px;min-width:76px}}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="brand" href="index.html"><img src="rosterbate-main-logo-transparent-v3.png" alt="RosterBate"><span>RosterBate</span></a>
  <a class="back-home" href="index.html">Back to Home</a>
</nav>
<div class="wrap">
  <section class="hero-shell">
    <div class="hero">
      <div>
        <div class="eyebrow">Sleeper League Analyzer · Basketball</div>
        <h1 id="leagueName">Fantasy League Dashboard</h1>
        <p id="leagueMeta">Live matchups, lock-in scoring, rosters and standings powered by your Sleeper league.</p>
      </div>
      <div class="controls">
        <input id="leagueInput" aria-label="Sleeper league id" value="1411477732390400000" placeholder="Sleeper League ID">
        <select id="weekSelect" aria-label="Week"></select>
        <button id="loadBtn">Load League</button>
      </div>
    </div>
    <div id="status" class="status">Loading Sleeper league…</div>
  </section>
  <section id="summary" class="summary" hidden></section>
  <section id="matchups" class="grid"></section>
  <section id="standings" class="standings" hidden></section>
  <div class="footer-note"><strong>RosterBate</strong> is independent from Sleeper and uses read-only public league data.</div>
</div>
<script>
const DEFAULT_LEAGUE='1411477732390400000';
const els={leagueName:document.getElementById('leagueName'),leagueMeta:document.getElementById('leagueMeta'),leagueInput:document.getElementById('leagueInput'),weekSelect:document.getElementById('weekSelect'),loadBtn:document.getElementById('loadBtn'),status:document.getElementById('status'),summary:document.getElementById('summary'),matchups:document.getElementById('matchups'),standings:document.getElementById('standings')};
let currentData=null;
function esc(value){return String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
function num(value,digits=1){const n=Number(value);return Number.isFinite(n)?n.toFixed(digits):'0.0';}
function teamFor(rosterId){return currentData.teams.find(t=>Number(t.roster_id)===Number(rosterId));}
function playerFor(id){return currentData.players[String(id)]||{full_name:`Player ${id}`,team:'',position:''};}
function matchupPlayerRows(matchup,starterMode){const starters=(matchup.starters||[]).map(String);const ids=starterMode?(matchup.starters||[]).filter(id=>String(id)!=='0'):(matchup.players||[]).filter(id=>!starters.includes(String(id)));if(!ids.length)return '<div class="empty">No players</div>';return ids.map(id=>{const p=playerFor(id);const pts=(matchup.players_points||{})[id]??(matchup.players_points||{})[String(id)]??0;return `<div class="player"><div class="player-main"><div class="player-name">${esc(p.full_name)}</div><div class="player-meta">${esc([p.team,p.position].filter(Boolean).join(' · '))}</div></div><div class="pts">${num(pts)}</div></div>`}).join('')}
function renderSummary(){const ms=currentData.matchups||[];const high=ms.reduce((best,m)=>Number(m.points||0)>Number(best.points||0)?m:best,ms[0]||{points:0});const highTeam=teamFor(high.roster_id);const locked=ms.reduce((s,m)=>s+(m.starters||[]).filter(id=>String(id)!=='0').length,0);const avg=ms.length?ms.reduce((s,m)=>s+Number(m.points||0),0)/ms.length:0;els.summary.innerHTML=`<div class="stat"><div class="stat-label">Teams</div><div class="stat-value">${currentData.teams.length}</div></div><div class="stat"><div class="stat-label">Week</div><div class="stat-value">${currentData.week}</div></div><div class="stat"><div class="stat-label">Highest Score</div><div class="stat-value">${num(high.points)}</div><div class="player-meta">${esc(highTeam?.team_name||'')}</div></div><div class="stat"><div class="stat-label">League Avg</div><div class="stat-value">${num(avg)}</div><div class="player-meta">${locked} locked slots</div></div>`;els.summary.hidden=false}
function renderMatchups(){const grouped=new Map();for(const m of currentData.matchups||[]){const key=m.matchup_id==null?`solo-${m.roster_id}`:String(m.matchup_id);if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(m)}els.matchups.innerHTML=[...grouped.values()].map(group=>{const a=group[0],b=group[1];const ta=teamFor(a?.roster_id)||{},tb=teamFor(b?.roster_id)||{};const ap=Number(a?.points||0),bp=Number(b?.points||0);const roster=m=>m?`<div class="roster"><div class="section-title">Locked / Starters</div>${matchupPlayerRows(m,true)}<div class="section-title" style="margin-top:13px">Bench / Other Games</div><div class="bench">${matchupPlayerRows(m,false)}</div></div>`:'<div class="roster"><div class="empty">Bye</div></div>';return `<article class="matchup"><div class="matchup-head"><div class="team"><div class="team-name">${esc(ta.team_name||'Team')}</div><div class="owner">${esc(ta.display_name||'')}</div></div><div class="score"><span class="${ap>bp?'leader':''}">${num(ap)}</span><span class="vs">VS</span><span class="${bp>ap?'leader':''}">${num(bp)}</span></div><div class="team right"><div class="team-name">${esc(tb.team_name||'Bye')}</div><div class="owner">${esc(tb.display_name||'')}</div></div></div><div class="rows">${roster(a)}${roster(b)}</div></article>`}).join('')||'<div class="empty">No matchups returned for this week.</div>'}
function renderStandings(){const rows=(currentData.teams||[]).slice().sort((a,b)=>{const aw=Number(a.settings?.wins||0),bw=Number(b.settings?.wins||0);if(bw!==aw)return bw-aw;return Number(b.settings?.fpts||0)-Number(a.settings?.fpts||0)});els.standings.innerHTML=`<h2>League Standings</h2>${rows.map((t,i)=>{const s=t.settings||{};const fpts=Number(s.fpts||0)+(Number(s.fpts_decimal||0)/100);return `<div class="standing-row"><div class="rank">#${i+1}</div><div><strong>${esc(t.team_name)}</strong><div class="player-meta">${esc(t.display_name)}</div></div><div class="record">${Number(s.wins||0)}-${Number(s.losses||0)}${Number(s.ties||0)?'-'+Number(s.ties):''}</div><div class="pf">${num(fpts)} PF</div></div>`}).join('')}`;els.standings.hidden=false}
function setWeekOptions(selected,maxWeek){const max=Math.max(26,Number(maxWeek)||26);els.weekSelect.innerHTML=Array.from({length:max},(_,i)=>`<option value="${i+1}" ${i+1===Number(selected)?'selected':''}>Week ${i+1}</option>`).join('')}
async function load(){const league=String(els.leagueInput.value||DEFAULT_LEAGUE).trim(),week=Number(els.weekSelect.value)||0;els.status.className='status';els.status.textContent='Loading Sleeper league…';els.matchups.innerHTML='';els.summary.hidden=true;els.standings.hidden=true;els.loadBtn.disabled=true;try{const qs=new URLSearchParams({league});if(week)qs.set('week',week);const res=await fetch(`/.netlify/functions/sleeper-basketball?${qs}`);const data=await res.json();if(!res.ok)throw new Error(data.error||'Unable to load league');currentData=data;els.leagueName.textContent=data.league.name||'Sleeper Basketball';els.leagueMeta.textContent=`${data.league.season||''} · ${data.teams.length} teams · Week ${data.week} · Live Sleeper basketball`;setWeekOptions(data.week,data.league.settings?.playoff_week_start||26);renderSummary();renderMatchups();renderStandings();els.status.textContent=`Sleeper data loaded · Week ${data.week}`;const url=new URL(location.href);url.searchParams.set('league',league);url.searchParams.set('week',data.week);history.replaceState({},'',url)}catch(error){els.status.className='error';els.status.textContent=error.message||String(error)}finally{els.loadBtn.disabled=false}}
els.loadBtn.addEventListener('click',load);els.weekSelect.addEventListener('change',load);els.leagueInput.addEventListener('keydown',event=>{if(event.key==='Enter')load()});const params=new URLSearchParams(location.search);els.leagueInput.value=params.get('league')||DEFAULT_LEAGUE;setWeekOptions(Number(params.get('week'))||1,26);load();
</script>
</body>
</html>
