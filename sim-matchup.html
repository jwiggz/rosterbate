<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RosterBate · Live Sim</title>
<style>
/* ── Reset & Base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #0a0a12;
  --surface:   #0f0f1e;
  --surface2:  #14142a;
  --border:    #1e1e38;
  --purple:    #c084fc;
  --purple-d:  #7c3aed;
  --cyan:      #38bdf8;
  --cyan-d:    #0284c7;
  --green:     #4ade80;
  --yellow:    #fbbf24;
  --red:       #f87171;
  --text:      #e2e2ff;
  --muted:     #555570;
  --court-bg:  #1a3a1a;
  --court-line:#2d5a2d;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  user-select: none;
}

/* ── Header / Scoreboard ──────────────────────────────────── */
#header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
#logo {
  font-size: 14px;
  font-weight: 900;
  color: var(--purple);
  letter-spacing: 2px;
  text-transform: uppercase;
  white-space: nowrap;
}
#scoreboard {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
}
.score-team {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
}
.score-team.home { border-radius: 8px 0 0 8px; border-right: none; }
.score-team.away { border-radius: 0 8px 8px 0; border-left: none; }
.score-team-name { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.score-team-name.purple { color: var(--purple); }
.score-team-name.cyan   { color: var(--cyan); }
.score-val {
  font-size: 24px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  min-width: 48px;
  text-align: center;
}
.score-val.purple { color: var(--purple); text-shadow: 0 0 16px #c084fc55; }
.score-val.cyan   { color: var(--cyan);   text-shadow: 0 0 16px #38bdf855; }
#clock-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 4px 14px;
  background: #000;
  border: 1px solid var(--border);
  min-width: 90px;
}
#quarter-label { font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
#clock-display { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--yellow); }
#live-badge {
  display: flex; align-items: center; gap: 5px;
  font-size: 9px; color: var(--green); letter-spacing: 2px; font-weight: 700;
}
#live-dot { width: 7px; height: 7px; background: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); animation: blink 1.2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

#controls {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.btn {
  border: none; cursor: pointer; border-radius: 20px;
  font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  padding: 6px 14px; transition: opacity .15s;
}
.btn:hover { opacity: .85; }
.btn-primary { background: var(--purple); color: #0a0a12; }
.btn-secondary { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }
.btn-speed { background: var(--surface2); border: 1px solid var(--border); color: var(--yellow); font-size: 10px; padding: 5px 10px; border-radius: 6px; }
.btn-speed.active { background: var(--yellow); color: #000; }

/* ── Main layout ──────────────────────────────────────────── */
#main {
  flex: 1;
  display: grid;
  grid-template-columns: 220px 1fr 220px;
  grid-template-rows: 1fr 140px;
  gap: 0;
  overflow: hidden;
  min-height: 0;
}

/* ── Side panels ──────────────────────────────────────────── */
.side-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-header {
  padding: 7px 10px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-header.purple { color: var(--purple); border-top: 2px solid var(--purple); }
.panel-header.cyan   { color: var(--cyan);   border-top: 2px solid var(--cyan); }
.panel-body { flex: 1; overflow-y: auto; padding: 8px; display:flex; flex-direction:column; gap:8px; }
.panel-body::-webkit-scrollbar { width: 3px; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Player rows */
.player-row {
  display: flex;
  align-items: center;
  padding: 8px;
  gap: 9px;
  border: 1px solid rgba(226,226,255,.08);
  border-radius: 14px;
  background:
    radial-gradient(circle at 18% 16%, color-mix(in srgb, var(--row-accent,var(--purple)) 24%, transparent), transparent 34%),
    linear-gradient(180deg,rgba(24,24,46,.94),rgba(10,10,20,.92));
  transition: background .15s, transform .15s, box-shadow .15s;
  position:relative;
  overflow:hidden;
}
.player-row:before{content:'';position:absolute;inset:0;border-radius:inherit;border-left:3px solid var(--row-accent,var(--purple));opacity:.7;pointer-events:none;}
.player-row.active-player { transform:translateY(-1px); box-shadow:0 0 0 1px color-mix(in srgb, var(--row-accent,var(--purple)) 40%, transparent),0 16px 28px rgba(0,0,0,.24); }
.player-showcase-card{min-height:82px;}
.player-row.portrait-pop .live-player-portrait{animation:portraitPop .7s cubic-bezier(.2,1.4,.24,1);}
.player-row.portrait-pop .player-event-badge{opacity:1;transform:translateY(0) scale(1);}
.player-dot-indicator {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.live-player-portrait{
  width:58px;
  height:68px;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  border-radius:14px;
  border:1px solid rgba(226,226,255,.18);
  background:linear-gradient(180deg,#f8fafc,#dbeafe);
  box-shadow:0 10px 20px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.7);
  isolation:isolate;
}
.live-player-portrait .portrait-card-bg,.live-player-portrait .portrait-backdrop{position:absolute;inset:0;background:radial-gradient(circle at 50% 15%,#fff 0 34%,rgba(255,255,255,.86) 35% 62%,rgba(241,245,249,.94) 100%);}
.live-player-portrait .portrait-neck{position:absolute;left:39%;right:39%;top:46%;height:18%;border-radius:999px;background:var(--portrait-skin);z-index:2;}
.live-player-portrait .portrait-body{position:absolute;left:14%;right:14%;bottom:-6%;height:39%;border-radius:44% 44% 8% 8%;background:linear-gradient(145deg,var(--portrait-team),var(--portrait-team-2));box-shadow:inset 0 5px 0 rgba(255,255,255,.24),0 0 0 2px #111827;z-index:3;}
.live-player-portrait .portrait-body:before,.live-player-portrait .portrait-body:after{content:'';position:absolute;top:0;width:18%;height:100%;background:rgba(255,255,255,.82);}
.live-player-portrait .portrait-body:before{left:13%;}
.live-player-portrait .portrait-body:after{right:13%;}
.live-player-portrait .portrait-head{position:absolute;left:29%;right:29%;top:15%;height:41%;border-radius:48% 48% 44% 44%;background:var(--portrait-skin);box-shadow:inset -5px -7px 0 rgba(116,69,47,.12),0 0 0 2px #111827;z-index:4;}
.live-player-portrait .portrait-ear{position:absolute;left:25%;right:25%;top:31%;height:12%;z-index:3;}
.live-player-portrait .portrait-ear:before,.live-player-portrait .portrait-ear:after{content:'';position:absolute;top:0;width:7px;height:10px;border-radius:50%;background:var(--portrait-skin);box-shadow:0 0 0 1.5px #111827;}
.live-player-portrait .portrait-ear:before{left:0;}
.live-player-portrait .portrait-ear:after{right:0;}
.live-player-portrait .portrait-hair{position:absolute;left:26%;right:26%;top:9%;height:24%;border-radius:50% 50% 34% 34%;background:var(--portrait-hair);box-shadow:0 0 0 2px #111827;z-index:5;}
.live-player-portrait .portrait-hair:after{content:'';position:absolute;left:7%;right:7%;bottom:-34%;height:52%;border-radius:0 0 50% 50%;background:var(--portrait-hair);}
.live-player-portrait .portrait-face{position:absolute;left:38%;right:38%;top:32%;height:15%;z-index:6;}
.live-player-portrait .portrait-face:before,.live-player-portrait .portrait-face:after{content:'';position:absolute;top:0;width:3px;height:3px;border-radius:50%;background:#0f172a;box-shadow:0 8px 0 -1px rgba(15,23,42,.72);}
.live-player-portrait .portrait-face:before{left:0;}
.live-player-portrait .portrait-face:after{right:0;}
.live-player-portrait .portrait-nose{position:absolute;left:48%;top:36%;width:3px;height:10%;border-right:1.5px solid rgba(15,23,42,.75);border-bottom:1.5px solid rgba(15,23,42,.75);border-radius:0 0 4px 0;z-index:7;}
.live-player-portrait .portrait-mouth{position:absolute;left:42%;right:42%;top:48%;height:5%;border-bottom:1.7px solid rgba(15,23,42,.8);border-radius:50%;z-index:7;}
.live-player-portrait .portrait-ink-outline{position:absolute;inset:8%;border-radius:12px;box-shadow:inset 0 0 0 1.5px rgba(15,23,42,.16);z-index:8;pointer-events:none;}
.live-player-portrait .portrait-initials{position:absolute;right:4px;bottom:3px;z-index:7;font-size:9px;font-weight:900;color:#0f172a;background:rgba(255,255,255,.78);border-radius:4px;padding:0 3px;line-height:1.2;}
.live-player-portrait .player-portrait-img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top;border-radius:inherit;background:#fff;}
.live-player-portrait:after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .18s,box-shadow .18s;background:linear-gradient(135deg,rgba(255,255,255,.22),transparent 42%);}
.live-player-portrait.portrait-state-offday{filter:saturate(.45) brightness(.78);opacity:.72;}
.live-player-portrait.portrait-state-injured{filter:saturate(.55) brightness(.72);box-shadow:0 0 0 1px rgba(239,68,68,.42),0 10px 20px rgba(127,29,29,.28);}
.live-player-portrait.portrait-state-injured:after{opacity:1;background:repeating-linear-gradient(135deg,rgba(239,68,68,.28) 0 4px,transparent 4px 10px);}
.live-player-portrait.portrait-state-questionable{box-shadow:0 0 0 1px rgba(245,158,11,.42),0 10px 20px rgba(120,53,15,.24);}
.live-player-portrait.portrait-state-takeover{box-shadow:0 0 0 1px rgba(251,191,36,.75),0 0 26px rgba(251,191,36,.3),0 10px 20px rgba(0,0,0,.22);}
.live-player-portrait.portrait-state-takeover:after{opacity:1;box-shadow:inset 0 0 18px rgba(251,191,36,.38);}
@keyframes portraitPop{
  0%{transform:translateY(0) scale(1);}
  36%{transform:translateY(-6px) scale(1.12);box-shadow:0 0 0 4px rgba(251,191,36,.18),0 16px 28px rgba(0,0,0,.3);}
  100%{transform:translateY(0) scale(1);}
}
.player-info { flex: 1; min-width: 0; position:relative; z-index:2; align-self:stretch; display:flex; flex-direction:column; justify-content:center; }
.player-name { font-size: 12px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing:.01em; }
.player-pos-team { font-size: 9px; color: var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:2px; }
.player-fp-col { text-align: right; flex-shrink: 0; }
.player-fp-val { font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
.player-fp-val.purple { color: var(--purple); }
.player-fp-val.cyan   { color: var(--cyan); }
.player-fp-label { font-size: 8px; color: var(--muted); letter-spacing: 1px; }
.player-last-event { font-size: 9px; color: var(--muted); margin-top: 7px; min-height: 12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.player-event-badge{
  position:absolute;
  left:48px;
  top:4px;
  z-index:8;
  min-width:38px;
  text-align:center;
  border-radius:999px;
  padding:3px 6px;
  background:var(--yellow);
  color:#09090f;
  font-size:10px;
  font-weight:900;
  box-shadow:0 8px 18px rgba(251,191,36,.25);
  opacity:0;
  transform:translateY(5px) scale(.86);
  transition:opacity .18s ease, transform .18s ease;
}

/* ── Court ────────────────────────────────────────────────── */
#court-wrap {
  position: relative;
  overflow: hidden;
  background: var(--court-bg);
  display: flex;
  align-items: center;
  justify-content: center;
}
#court-svg { width: 100%; height: 100%; }

/* ── Play-by-play ─────────────────────────────────────────── */
#pbp-panel {
  grid-column: 1 / -1;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#pbp-header {
  padding: 5px 12px;
  font-size: 9px;
  letter-spacing: 2px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#pbp-body {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
  display: flex;
  flex-direction: column-reverse;
}
#pbp-body::-webkit-scrollbar { width: 3px; }
#pbp-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.pbp-entry {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 3px 12px;
  border-bottom: 1px solid #0d0d1a;
  font-size: 11px;
  animation: slideIn .3s ease;
}
@keyframes slideIn { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform: translateY(0); } }
.pbp-time { font-size: 9px; color: var(--muted); font-variant-numeric: tabular-nums; width: 38px; flex-shrink: 0; }
.pbp-team-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 2px; }
.pbp-text { flex: 1; color: #aab; }
.pbp-fp { font-weight: 700; font-size: 11px; flex-shrink: 0; }

@media (max-width: 760px) {
  body { font-size: 12px; }
  #header {
    flex-wrap: wrap;
    gap: 6px;
    padding: 6px 8px;
  }
  #logo {
    font-size: 11px;
    letter-spacing: 1px;
  }
  #scoreboard {
    order: 2;
    flex: 1 1 100%;
    min-width: 0;
  }
  .score-team {
    min-width: 0;
    flex: 1 1 0;
    gap: 4px;
    padding: 4px 6px;
  }
  .score-team-name {
    max-width: 72px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 9px;
  }
  .score-val {
    font-size: 18px;
    min-width: 34px;
  }
  #clock-block {
    min-width: 58px;
    padding: 4px 6px;
  }
  #clock-display { font-size: 16px; }
  #controls {
    order: 3;
    flex: 1 1 100%;
    justify-content: center;
    flex-wrap: wrap;
    gap: 5px;
  }
  .btn {
    border-radius: 8px;
    font-size: 9px;
    padding: 5px 8px;
    letter-spacing: .5px;
  }
  .btn-speed {
    padding: 5px 7px;
  }
  #main {
    grid-template-columns: minmax(96px, 28vw) minmax(120px, 1fr) minmax(96px, 28vw);
    grid-template-rows: minmax(0, 1fr) 150px;
  }
  .player-row {
    padding: 5px;
    gap: 5px;
    min-height:70px;
  }
  .player-name { font-size: 10px; }
  .player-pos-team { font-size: 8px; }
  .live-player-portrait{width:40px;height:48px;border-radius:10px;}
  .player-event-badge{left:32px;top:2px;font-size:8px;min-width:30px;padding:2px 4px;}
  .player-fp-val { font-size: 12px; }
}

/* ── Score popup ──────────────────────────────────────────── */
.score-popup {
  position: absolute;
  pointer-events: none;
  font-size: 12px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 12px;
  white-space: nowrap;
  animation: floatUp .9s ease forwards;
  z-index: 20;
}
@keyframes floatUp {
  0%   { opacity:1; transform: translateY(0) scale(1); }
  70%  { opacity:1; transform: translateY(-30px) scale(1.05); }
  100% { opacity:0; transform: translateY(-50px) scale(0.9); }
}

/* ── Halftime overlay ─────────────────────────────────────── */
#overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.8);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
#overlay.hidden { display: none; }
#overlay-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 40px;
  text-align: center;
  min-width: 320px;
}
#overlay-title { font-size: 18px; font-weight: 900; color: var(--yellow); letter-spacing: 3px; margin-bottom: 16px; }
#overlay-scores { display: flex; justify-content: center; gap: 40px; margin-bottom: 20px; }
.overlay-team { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.overlay-team-name { font-size: 11px; letter-spacing: 1px; font-weight: 700; }
.overlay-score { font-size: 40px; font-weight: 900; }
#overlay-btn { margin-top: 8px; }
#overlay-sub { font-size: 10px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>

<!-- Overlay for halftime / game over -->
<div id="overlay" class="hidden">
  <div id="overlay-card">
    <div id="overlay-title">HALFTIME</div>
    <div id="overlay-scores">
      <div class="overlay-team">
        <div class="overlay-team-name" id="ov-name-a" style="color:var(--purple)">Team A</div>
        <div class="overlay-score" id="ov-score-a" style="color:var(--purple)">0.0</div>
      </div>
      <div class="overlay-team">
        <div class="overlay-team-name" id="ov-name-b" style="color:var(--cyan)">Team B</div>
        <div class="overlay-score" id="ov-score-b" style="color:var(--cyan)">0.0</div>
      </div>
    </div>
    <div id="overlay-top-player" style="font-size:11px;color:var(--muted);margin-bottom:12px"></div>
    <button class="btn btn-primary" id="overlay-btn" onclick="resumeSim()">▶ Continue</button>
    <div id="overlay-sub"></div>
  </div>
</div>

<!-- Header -->
<div id="header">
  <div id="logo">⚡ RosterBate</div>

  <div id="scoreboard">
    <div class="score-team home">
      <div class="score-team-name purple" id="team-a-name">PURPLE RAIN</div>
      <div class="score-val purple" id="score-a">0.0</div>
    </div>
    <div id="clock-block">
      <div id="quarter-label">Q1</div>
      <div id="clock-display">12:00</div>
    </div>
    <div class="score-team away">
      <div class="score-val cyan" id="score-b">0.0</div>
      <div class="score-team-name cyan" id="team-b-name">ICE COLD</div>
    </div>
  </div>

  <div id="controls">
    <div id="live-badge"><div id="live-dot"></div>LIVE</div>
    <button class="btn btn-speed" id="speed-1x" onclick="setSpeed(1)">1×</button>
    <button class="btn btn-speed active" id="speed-3x" onclick="setSpeed(3)">3×</button>
    <button class="btn btn-speed" id="speed-5x" onclick="setSpeed(5)">5×</button>
    <button class="btn btn-primary" id="btn-reveal-final" onclick="revealLiveFinal()" style="display:none">Reveal Final</button>
    <button class="btn btn-secondary" id="btn-pause" onclick="togglePause()">⏸ Pause</button>
    <button class="btn btn-primary" id="btn-new" onclick="startNewGame()">↺ New Game</button>
  </div>
</div>

<!-- Main -->
<div id="main">
  <!-- Left roster -->
  <div class="side-panel" id="panel-a">
    <div class="panel-header purple" id="panel-a-header">PURPLE RAIN</div>
    <div class="panel-body" id="roster-a"></div>
  </div>

  <!-- Court -->
  <div id="court-wrap">
    <svg id="court-svg" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <!-- Court background -->
      <rect width="600" height="400" fill="#1a3a1a"/>
      <!-- Court outline -->
      <rect x="20" y="20" width="560" height="360" fill="#1e441e" stroke="#2d6b2d" stroke-width="2" rx="4"/>
      <!-- Center circle -->
      <circle cx="300" cy="200" r="40" fill="none" stroke="#2d6b2d" stroke-width="1.5"/>
      <line x1="300" y1="20" x2="300" y2="380" stroke="#2d6b2d" stroke-width="1.5"/>
      <!-- Left key -->
      <rect x="20" y="130" width="120" height="140" fill="#1c3e1c" stroke="#2d6b2d" stroke-width="1.5"/>
      <rect x="20" y="155" width="60" height="90" fill="none" stroke="#2d6b2d" stroke-width="1"/>
      <!-- Left basket -->
      <circle cx="55" cy="200" r="12" fill="none" stroke="#c8a96e" stroke-width="2"/>
      <line x1="20" y1="200" x2="55" y2="200" stroke="#c8a96e" stroke-width="1.5"/>
      <!-- Left 3pt arc -->
      <path d="M 20 80 Q 200 200 20 320" fill="none" stroke="#2d6b2d" stroke-width="1.5"/>
      <!-- Right key -->

// ── Utilities ──────────────────────────────────────────────────────────────
const rnd  = (min,max) => Math.random()*(max-min)+min;
const pick  = arr => arr[Math.floor(Math.random()*arr.length)];
const fmt   = n => n.toFixed(1);
const fmtClock = s => {

const escHtml = value => String(value ?? '')
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')

  .replace(/'/g,'&#39;');

function shuffle(arr) {
  for (let i=arr.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function pickTeams() {
  const pool = shuffle([...PLAYER_POOL]);
  // Weight by fp — higher fp players are more likely to be picked first
  pool.sort((a,b) => b.fp - a.fp + rnd(-15,15));
  return [pool.slice(0,8), pool.slice(8,16)];
}

const dotEls = {};

function createDots(players, side, color, shortColor) {
  const positions = side==='A' ? HOME_POSITIONS : AWAY_POSITIONS;
  players.slice(0,5).forEach((p,i) => {
    const pos = positions[i];
    p._x = pos.x; p._y = pos.y;
    p._targetX = pos.x; p._targetY = pos.y;
    p._motionSpeed = 9;
    p._color = color;
    p._shortColor = shortColor;
    p._side = side;

    const g = document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("id", `dot-${p._id}`);

    const circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("r","10");
    circle.setAttribute("fill", color);
    circle.setAttribute("fill-opacity","0.85");
    circle.setAttribute("stroke","#000");
    circle.setAttribute("stroke-width","1.5");

    const label = document.createElementNS("http://www.w3.org/2000/svg","text");
    label.setAttribute("text-anchor","middle");
    label.setAttribute("dominant-baseline","central");
    label.setAttribute("font-size","7");
    label.setAttribute("font-weight","bold");
    label.setAttribute("fill","#fff");
    label.setAttribute("pointer-events","none");
    label.textContent = p.name.split(' ').pop().slice(0,5);

    g.appendChild(circle); g.appendChild(label);
    document.getElementById("player-dots").appendChild(g);
    dotEls[p._id] = { g, circle, label };
    moveDot(p, p._x, p._y);
  });
}

function moveDot(player, x, y) {
  const el = dotEls[player._id];
  if (!el) return;
  el.g.setAttribute("transform", `translate(${x},${y})`);
}

function moveBall(x, y) {
  const el = document.getElementById('ball-dot');
  if (!el) return;
  el.setAttribute('transform', `translate(${x},${y})`);
}

function setCourtTarget(player, x, y, motionSpeed = 10) {
  if (!player) return;
  player._targetX = Math.max(25, Math.min(575, Number(x) || 300));
  player._targetY = Math.max(35, Math.min(365, Number(y) || 200));
  player._motionSpeed = Math.max(4, Math.min(18, Number(motionSpeed || 10)));
}

function setBallTarget(x, y, motionSpeed = 12) {
  liveBall._targetX = Math.max(25, Math.min(575, Number(x) || 300));
  liveBall._targetY = Math.max(35, Math.min(365, Number(y) || 200));
  liveBall._motionSpeed = Math.max(6, Math.min(22, Number(motionSpeed || 12)));
}

function setBallVisible(visible) {
  const el = document.getElementById('ball-dot');
  if (el) el.style.display = visible ? '' : 'none';
}

function animateBall() {
  const dx = liveBall._targetX - liveBall._x;
  const dy = liveBall._targetY - liveBall._y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < 2) {
    liveBall._x = liveBall._targetX;
    liveBall._y = liveBall._targetY;
  } else {
    const speed = Math.min(Math.max(6, Math.min(22, Number(liveBall._motionSpeed || 12))), dist);
    liveBall._x += (dx / dist) * speed;
    liveBall._y += (dy / dist) * speed;
  }
  moveBall(liveBall._x, liveBall._y);
}

function animateDots() {
  [...teamA, ...teamB].forEach(p => {
    if (!p._x) return;
    const dx = p._targetX - p._x, dy = p._targetY - p._y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    // If very close just snap, otherwise move at fixed px/tick speed
    if (dist < 2) {
      p._x = p._targetX;
      p._y = p._targetY;
    } else {
      // Move at up to 18px per tick — fast enough to cross the court in ~1.5s
      const maxSpeed = Math.max(4, Math.min(18, Number(p._motionSpeed || (liveMatchupMode ? 9 : 18))));
      const speed = Math.min(maxSpeed, dist);
      p._x += (dx / dist) * speed;
      p._y += (dy / dist) * speed;
    }
    moveDot(p, p._x, p._y);
  });
  animateBall();
}

function setRandomTarget(player) {

function livePortraitSeed(player) {
  const source = `${player?.name || 'Player'}|${player?.team || ''}`;
  let hash = 0;
  for (let index = 0; index < source.length; index++) hash = ((hash << 5) - hash) + source.charCodeAt(index), hash |= 0;
  return Math.abs(hash);
}

// ── Possession-based play engine ───────────────────────────────────────────
// Each possession: offense picks a play type based on their skills,
// defense contests based on their STL/BLK ratings.
// Outcome probabilities are driven by real player stat values.

function weightedRandom(options) {
  // options: [{value, weight}, ...]
  const total = options.reduce((s,o)=>s+o.weight,0);
  let r = Math.random()*total;
  for (const o of options) { r -= o.weight; if (r<=0) return o.value; }
  return options[options.length-1].value;
}

// Normalize a stat to a 0-1 scale given reasonable NBA ranges
function norm(val, lo, hi) { return Math.max(0, Math.min(1, (val-lo)/(hi-lo))); }

function runPossession(offTeam, defTeam) {
  // Pick ball-handler: weight by offensive rating (fp)
  const offWeights = offTeam.slice(0,5).map(p=>({value:p, weight:p.fp}));
  const ballHandler = weightedRandom(offWeights);

  // Pick defender: match roughly by position, else random
  const defWeights = defTeam.slice(0,5).map(p=>({value:p, weight:p.fp * rnd(0.6,1.4)}));
  const defender = weightedRandom(defWeights);

  const sv = ballHandler.statValues;
  const dv = defender.statValues;

  // ── Step 1: Turnover check ────────────────────────────────────────────────
  // TO chance scales with handler's TO rate; STL chance scales with defender's STL
  const toChance  = norm(sv.TO,  0.5, 5.0) * 0.18;
  const stlChance = norm(dv.STL, 0.5, 2.5) * 0.12;
  const roll = Math.random();

  if (roll < stlChance) {
    // STEAL — defender gets FP, ball-handler gets TO FP hit
    const defFP = 3.0;
    const offFP = -1.0;
    defender._fp  += defFP;
    ballHandler._fp += offFP;
    if (offTeam === teamA) { scoreA += offFP; } else { scoreB += offFP; }
    addPBP(defender,    `🔥 ${defender.name} picks the pocket of ${ballHandler.name}!`, defFP,  clockSec, defender._color, defender._side);
    addPBP(ballHandler, `💨 ${ballHandler.name} turns it over — stolen`, offFP, clockSec, ballHandler._color, ballHandler._side);
    updatePlayerFP(defender);
    updatePlayerFP(ballHandler);
    updatePlayerEvent(defender,    `STL on ${ballHandler.name}`);
    updatePlayerEvent(ballHandler, `Turnover — stolen`);
    showScorePopup(defender,    defFP);
    showScorePopup(ballHandler, offFP);
    // Defender lunges onto ball-handler for the steal
    defender._targetX = jitter(ballHandler._x, 8);
    defender._targetY = jitter(ballHandler._y, 8);
    // Ball-handler stumbles back toward mid-court
    ballHandler._targetX = jitter(300, 40);
    ballHandler._targetY = jitter(200, 40);
    possession = defTeam === teamA ? 'A' : 'B';
    attackingRight = !attackingRight;
    return;
  }

  if (roll < stlChance + toChance) {
    // Pure turnover (no steal credit)
    const offFP = -1.0;
    ballHandler._fp += offFP;
    if (offTeam === teamA) { scoreA += offFP; } else { scoreB += offFP; }
    addPBP(ballHandler, `${ballHandler.name} loses the handle — turnover`, offFP, clockSec, ballHandler._color, ballHandler._side);
    updatePlayerFP(ballHandler);
    updatePlayerEvent(ballHandler, `Turnover`);
    showScorePopup(ballHandler, offFP);
    possession = defTeam === teamA ? 'A' : 'B';
    attackingRight = !attackingRight;
    return;
  }

  // ── Step 2: Choose shot type ───────────────────────────────────────────────
  // 3-pointer chance scales with player's 3PM stat
  const threePct = norm(sv["3PM"], 0, 5.0);
  const shotType = weightedRandom([
    { value:'3pt',  weight: threePct * 30 + 5 },
    { value:'2pt',  weight: 40 },
    { value:'mid',  weight: 15 },
    { value:'ft',   weight: 10 },
  ]);

  // ── Step 3: Block check (only on 2pt / mid) ────────────────────────────────
  if (shotType !== '3pt' && shotType !== 'ft') {
    const blkChance = norm(dv.BLK, 0.2, 2.5) * 0.10;
    if (Math.random() < blkChance) {
      const defFP = 3.0;
      const offFP = 0; // no TO, just shot blocked
      defender._fp += defFP;
      if (offTeam === teamA) { scoreA += offFP; } else { scoreB += offFP; }
      addPBP(defender,    `🛡️ ${defender.name} BLOCKS ${ballHandler.name}!`, defFP, clockSec, defender._color, defender._side);
      updatePlayerFP(defender);
      updatePlayerEvent(defender,    `BLK on ${ballHandler.name}`);
      updatePlayerEvent(ballHandler, `Shot blocked by ${defender.name}`);
      showScorePopup(defender, defFP);
      // Defender sprints to the basket to block
      defender._targetX = attackingRight ? jitter(530, 10) : jitter(70, 10);
      defender._targetY = jitter(200, 15);
      // Rebound after block
      resolveRebound(offTeam, defTeam, ballHandler);
      return;  // possession + attackingRight handled inside resolveRebound
    }
  }

  // ── Step 4: Assisted shot? ─────────────────────────────────────────────────
  // AST chance scales with handler's AST stat (passers assist more)
  const astChance = norm(sv.AST, 1, 12) * 0.55;
  let assister = null;
  if (Math.random() < astChance) {
    // Pick a teammate (not the ball handler) to get the assist
    const teammates = offTeam.slice(0,5).filter(p=>p._id !== ballHandler._id);
    assister = pick(teammates);
  }

  // ── Step 5: Make or miss ──────────────────────────────────────────────────
  // Make probability: offense quality vs defense quality
  const offStr = norm(sv.PTS, 8, 35);
  const defStr = norm(dv.STL + dv.BLK, 0.5, 4.5) * 0.4;
  let makeProb;
  if (shotType === '3pt')  makeProb = 0.30 + offStr*0.15 - defStr*0.08;
  else if (shotType==='ft')makeProb = 0.75 + offStr*0.10;
  else                     makeProb = 0.45 + offStr*0.20 - defStr*0.10;
  makeProb = Math.max(0.15, Math.min(0.85, makeProb));

  const made = Math.random() < makeProb;

  if (made) {
    let pts, fpOff, fpAst=0, label, icon;
    if (shotType === '3pt')  { pts=3; fpOff=3;   icon='🔥'; label=`${ballHandler.name} drains the three!`; }
    else if (shotType==='ft'){ pts=2; fpOff=2;   icon='🎯'; label=`${ballHandler.name} makes both FTs`; }
    else if (shotType==='mid'){ pts=2; fpOff=2;  icon='💫'; label=`${ballHandler.name} mid-range SPLASH`; }
    else                     { pts=2; fpOff=2;   icon='💥'; label=`${ballHandler.name} drives — scores!`; }

    if (assister) {
      fpAst = 1.5;
      assister._fp += fpAst;
      label += ` (AST: ${assister.name})`;
      updatePlayerFP(assister);
      updatePlayerEvent(assister, `AST → ${ballHandler.name}`);
      showScorePopup(assister, fpAst);
    }

    ballHandler._fp += fpOff;
    if (offTeam === teamA) { scoreA += fpOff + fpAst; } else { scoreB += fpOff + fpAst; }

    addPBP(ballHandler, `${icon} ${label}`, fpOff, clockSec, ballHandler._color, ballHandler._side);
    updatePlayerFP(ballHandler);
    updatePlayerEvent(ballHandler, `${pts} pts scored`);
    showScorePopup(ballHandler, fpOff);

    // Scorer drives right to the basket
    ballHandler._targetX = attackingRight ? jitter(548,8) : jitter(52,8);
    ballHandler._targetY = jitter(200, 15);
    if (assister) {
      // Assister cuts to the wing after the pass
      assister._targetX = attackingRight ? jitter(490,15) : jitter(110,15);
      assister._targetY = assister._y < 200 ? jitter(115,12) : jitter(285,12);
    }
    // After score, defense gets the ball and attacks the other end
    possession = defTeam === teamA ? 'A' : 'B';
    attackingRight = !attackingRight;

  } else {
    // Miss — contested by defender
    const contestDesc = shotType==='3pt'
      ? `${ballHandler.name} fires the three — off the mark (${defender.name} contests)`
      : `${ballHandler.name} attacks — ${defender.name} contests, no good`;
    addPBP(ballHandler, `🚫 ${contestDesc}`, 0, clockSec, ballHandler._color, ballHandler._side);
    updatePlayerEvent(ballHandler, `Miss — ${defender.name} contested`);
    updatePlayerEvent(defender,   `Contested ${ballHandler.name}`);
    // Ball-handler drives toward the basket on the shot attempt
    ballHandler._targetX = attackingRight ? jitter(530, 15) : jitter(70, 15);
    ballHandler._targetY = jitter(200, 20);
    defender._targetX = ballHandler._targetX + rnd(-18, 18);
    defender._targetY = ballHandler._targetY + rnd(-15, 15);
    // Rebound
    resolveRebound(offTeam, defTeam, ballHandler);
    // Defensive rebound → defense gets ball; offensive rebound → offense keeps it
  }
}

function resolveRebound(offTeam, defTeam, shooter) {
  // Weight rebound toward big men (C/PF) and high-REB players
  const allFive = [
    ...offTeam.slice(0,5).map(p=>({p, isOff:true})),
    ...defTeam.slice(0,5).map(p=>({p, isOff:false})),
  ];
  const rebWeights = allFive.map(({p,isOff})=>({
    value:{p,isOff},
    weight: (p.statValues.REB * 2.5) * (isOff ? 0.6 : 1.0) // defense more likely
  }));
  const {p:rebounder, isOff} = weightedRandom(rebWeights);
  const fpReb = rnd(1.0, 2.4);
  rebounder._fp += fpReb;
  const rebTeam = isOff ? offTeam : defTeam;
  if (rebTeam === teamA) { scoreA += fpReb; } else { scoreB += fpReb; }
  const rebLabel = isOff ? `${rebounder.name} offensive rebound!` : `${rebounder.name} defensive rebound`;
  addPBP(rebounder, rebLabel, fpReb, clockSec, rebounder._color, rebounder._side);
  updatePlayerFP(rebounder);
  updatePlayerEvent(rebounder, isOff ? `OFF REB` : `DEF REB`);
  showScorePopup(rebounder, fpReb);
  // Rebounder crashes to the basket
  rebounder._targetX = attackingRight ? jitter(535, 20) : jitter(65, 20);
  rebounder._targetY = jitter(200, 25);
  // Possession follows the rebound
  possession = (rebTeam === teamA) ? 'A' : 'B';
  // Defensive rebound → new offense attacks opposite end; offensive rebound → keep same end
  if (!isOff) attackingRight = !attackingRight;
}

function addPBP(player, text, fpGain, time, color, side) {
  const body = document.getElementById('pbp-body');
  const entry = document.createElement('div');
  entry.className = 'pbp-entry';
  const fpStr = fpGain > 0 ? `+${fmt(fpGain)}` : fpGain === 0 ? '' : fmt(fpGain);
  const fpColor = fpGain > 0 ? (side==='A'?'var(--purple)':'var(--cyan)') : fpGain < 0 ? 'var(--red)' : 'var(--muted)';
  entry.innerHTML = `
    <span class="pbp-time">Q${quarter} ${fmtClock(time)}</span>
    <span class="pbp-team-dot" style="background:${color}"></span>
    <span class="pbp-text">${text}</span>
    <span class="pbp-fp" style="color:${fpColor}">${fpStr}</span>
  `;
  body.prepend(entry);
  playCount++;
  document.getElementById('pbp-count').textContent = `${playCount} plays`;
}

function showScorePopup(player, fpGain) {
  const courtWrap = document.getElementById('court-wrap');
  const svg = document.getElementById('court-svg');
  const vb = svg.viewBox.baseVal;
  const rect = svg.getBoundingClientRect();
  const scaleX = rect.width  / vb.width;
  const scaleY = rect.height / vb.height;

  const popup = document.createElement('div');
  popup.className = 'score-popup';
  const fpStr = fpGain >= 0 ? `+${fmt(fpGain)} FP` : `${fmt(fpGain)} FP`;
  popup.textContent = fpStr;
  popup.style.left = ((player._x * scaleX) - 20) + 'px';
  popup.style.top  = ((player._y * scaleY) - 20) + 'px';
  popup.style.background = fpGain >= 0 ? (player._side==='A' ? '#7c3aed' : '#0284c7') : '#dc2626';
  popup.style.color = '#fff';
  courtWrap.appendChild(popup);
  setTimeout(()=>popup.remove(), 950);
}

function showLiveShotMarker(event, frame) {
  const shot = frame?.shotTarget;
  if (!shot || !event || Number(event?.fpGain || 0) < -0.05) return;
  const layer = document.getElementById('shot-markers');
  if (!layer) return;
  const made = document.createElementNS("http://www.w3.org/2000/svg", "g");
  made.setAttribute("transform", `translate(${shot.x},${shot.y})`);
  made.setAttribute("class", "shot-marker");
  const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  ring.setAttribute("r", String(/three/i.test(String(shot.role || '')) ? 7 : 6));
  ring.setAttribute("fill", "none");
  ring.setAttribute("stroke", "#60a5fa");
  ring.setAttribute("stroke-width", "2");
  ring.setAttribute("opacity", "0.95");
  const pulse = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  pulse.setAttribute("r", "2.5");
  pulse.setAttribute("fill", "#bfdbfe");
  pulse.setAttribute("opacity", "0.95");
  made.appendChild(ring);
  made.appendChild(pulse);
  layer.appendChild(made);
  setTimeout(() => made.remove(), 2600);
}

function normalizeLiveEntry(entry, side, color, shortColor) {
  const player = entry?.player || {};
  const targetFp = Math.max(
    0,
    Number(entry?.finalScore || entry?.simulatedStats?.fantasyPoints || player.fp || entry?.baseScore || 0)
  );
  return assignId({
    name: String(player.name || 'Player'),
    team: String(player.team || ''),
    pos: String(player.pos || player.primaryPosition || ''),
    fp: Math.max(1, targetFp || 1),
    statValues: entry?.simulatedStats || {},
    _targetFp: targetFp,
    _remainingFp: targetFp,
    _color: color,
    _shortColor: shortColor,
    _side: side
  });
}

function getLiveTeamName(side) {
  return side === 'A'
    ? document.getElementById('team-a-name').textContent
    : document.getElementById('team-b-name').textContent;
}

function describeLiveRevealEvent(event, fpGain, beforeA, beforeB, afterA, afterB) {
  const player = event?.player || {};
  const side = event?.side;
  const name = player.name || 'Player';
  const teamName = getLiveTeamName(side);
  if (fpGain < 0) return event?.text || `${name} gives one back`;
  const beforeLeader = beforeA === beforeB ? 'tie' : beforeA > beforeB ? 'A' : 'B';
  const afterLeader = afterA === afterB ? 'tie' : afterA > afterB ? 'A' : 'B';
  if (afterLeader === side && beforeLeader !== side) return `${name} puts ${teamName} ahead`;
  if (afterLeader === 'tie' && beforeLeader !== 'tie') return `${name} pulls it level`;
  const beforeGap = Math.abs(beforeA - beforeB);
  const afterGap = Math.abs(afterA - afterB);
  const wasTrailing = side === 'A' ? beforeA < beforeB : beforeB < beforeA;
  if (wasTrailing && afterGap < beforeGap) return `${name} closes the gap`;
  if (fpGain >= Math.max(7, Number(player._targetFp || 0) * 0.18)) return `${name} delivers a top-line burst`;
  if (afterLeader === side && beforeLeader === side) return `${name} answers back for ${teamName}`;
  return event?.text || `${name} adds a clean fantasy burst`;
}

function buildLiveRevealEvents(players, side, scoreTarget) {
  const engine = window.RosterBateLiveRevealEngine;
  if (engine && typeof engine.buildLiveRevealEvents === 'function') {
    return engine.buildLiveRevealEvents(players, side, scoreTarget);
  }
  const totalFp = players.reduce((sum, player) => sum + Number(player._targetFp || 0), 0) || 1;
  const eventCount = Math.max(12, Math.min(30, Math.round(totalFp / 7)));
  const events = [];
  for (let index = 0; index < eventCount; index++) {
    const remainingPlayers = players.filter(candidate => Number(candidate._remainingFp || 0) > 0.05);
    const remainingTotal = remainingPlayers.reduce((sum, candidate) => sum + Number(candidate._remainingFp || 0), 0);
    if (!remainingPlayers.length || remainingTotal <= 0.05) break;
    const player = weightedRandom(remainingPlayers.map(candidate => ({
      value: candidate,
      weight: Math.max(1, Number(candidate._remainingFp || candidate._targetFp || 1))
    })));
    const requestedGain = index === eventCount - 1 || remainingTotal <= 1.25
      ? remainingTotal
      : Math.max(0.8, Number(player._targetFp || 0) / 5 * rnd(0.55, 1.15));
    const fpGain = Math.min(Number(player._remainingFp || 0), requestedGain);
    if (fpGain < 0.1) {
      player._remainingFp = 0;
      continue;
    }
    player._remainingFp = Math.max(0, Number(player._remainingFp || 0) - fpGain);
    events.push({
      player,
      side,
      fpGain,
      scoreGain: scoreTarget * (fpGain / totalFp),
      text: pick([
        `${player.name} cashes in`,
        `${player.name} creates separation`,
        `${player.name} swings the matchup`,
        `${player.name} adds a clean fantasy burst`
      ])
    });
  }
  return events;
}

function splitLiveRevealEventsByHalf(events) {
  const engine = window.RosterBateLiveRevealEngine;
  if (engine && typeof engine.splitLiveRevealEventsByHalf === 'function') {
    return engine.splitLiveRevealEventsByHalf(events);
  }
  const cleanEvents = (Array.isArray(events) ? events : []).filter(event => Number(event?.fpGain || 0) >= 0.1);
  if (cleanEvents.length <= 1) return { first: cleanEvents, second: [] };
  const firstCount = Math.min(cleanEvents.length - 1, Math.max(1, Math.floor(cleanEvents.length * 0.48)));
  return {
    first: cleanEvents.slice(0, firstCount),
    second: cleanEvents.slice(firstCount)
  };
}

function applyLiveCourtMotionForEvent(event) {
  const motion = window.RosterBateLiveCourtMotion;
  if (!motion || typeof motion.buildLiveMotionFrame !== 'function') {
    const player = event?.player;
    if (player) setCourtTarget(player, (player._x || 300) + rnd(-40, 40), (player._y || 200) + rnd(-35, 35), 8);
    return;
  }
  if (!liveCourtMotionState || typeof liveCourtMotionState !== 'object') {
    liveCourtMotionState = typeof motion.createLiveMotionState === 'function'
      ? motion.createLiveMotionState({ possessionSide: liveCourtPossessionSide || 'A' })
      : { possessionSide: liveCourtPossessionSide || 'A', phase: 'transition', sequence: 0 };
  }
  const frame = motion.buildLiveMotionFrame({ state: liveCourtMotionState, event, teamA, teamB, quarter });
  (frame.targets || []).forEach(target => {
    const player = target?.player || [...teamA, ...teamB].find(candidate => candidate?._id === target?.playerId);
    if (!player) return;
    setCourtTarget(player, target.x, target.y, target.motionSpeed || 9);
  });
  if (frame.ballTarget) setBallTarget(frame.ballTarget.x, frame.ballTarget.y, frame.ballTarget.motionSpeed || 12);
  showLiveShotMarker(event, frame);
  liveCourtMotionState = frame.nextState || liveCourtMotionState;
  liveCourtPossessionSide = String(liveCourtMotionState?.possessionSide || liveCourtPossessionSide || 'A').toUpperCase() === 'B' ? 'B' : 'A';
}

function applyLiveRevealEvent(event) {
  const player = event?.player;
  if (!player) return;
  const fpGain = Number(event.fpGain || 0);
  if (Math.abs(fpGain) < 0.05) return;
  const beforeA = scoreA;
  const beforeB = scoreB;
  player._fp += fpGain;
  if (event.side === 'A') scoreA += Number(event.scoreGain || 0);
  else scoreB += Number(event.scoreGain || 0);
  addPBP(
    player,
    liveMatchupMode ? describeLiveRevealEvent(event, fpGain, beforeA, beforeB, scoreA, scoreB) : event.text,
    fpGain,
    clockSec,
    player._color,
    player._side
  );
  updatePlayerFP(player);
  updatePlayerEvent(player, fpGain >= 0 ? `+${fmt(fpGain)} FPTS` : `${fmt(fpGain)} FPTS`);
  showScorePopup(player, fpGain);
  applyLiveCourtMotionForEvent(event);
}

function commitLiveMatchupResult() {
  if (liveCommitted || !liveMatchupAdapter || !liveMatchupPrepared) return;
  liveCommitted = true;
  try {
    const nextState = liveMatchupAdapter.commitLiveMatchupResult(liveMatchupPrepared);
    const slots = window.RosterBateHistoricalUniverseSlots;
    if (slots && typeof slots.upsertFromState === 'function') {
      slots.upsertFromState(nextState, { slotId: liveMatchupSlotId });
    }
    try { localStorage.setItem('rosterbateDraft', JSON.stringify(nextState)); } catch (error) {}
    if (liveMatchupEmbedded && window.parent && window.parent !== window) {
      window.parent.postMessage({ type:'rosterbate-live-matchup-committed', slotId:liveMatchupSlotId }, window.location.origin);
    }
  } catch (error) {
    console.warn('Live matchup commit failed', error);
    liveCommitted = false;
  }
}

function stageLiveMatchupReturnIntent() {
  const returnsToSeason = /(?:^|\/)rosterbate-season\.html(?:[?#]|$)/i.test(String(liveMatchupReturnUrl || ''));
  if (!liveMatchupMode || liveMatchupEmbedded || !liveMatchupSlotId || (!liveMatchupAutoFinishDayOnReturn && !returnsToSeason)) return;
  try {
    sessionStorage.setItem(RB_SIM_LIVE_RETURN_KEY, JSON.stringify({
      slotId: liveMatchupSlotId,
      day: Number(liveMatchupPrepared?.gameLog?.day || 0) || null,
      autoFinishDayOnReturn: true,
      savedAt: Date.now()
    }));
  } catch (error) {}
}

function bootLiveMatchupFromParams() {
  const params = new URLSearchParams(window.location.search);
  const slotId = String(params.get('historicalUniverse') || '').trim();
  const day = Number(params.get('day') || 0) || 0;
  const homeAbbr = String(params.get('homeAbbr') || '').trim().toUpperCase();
  const awayAbbr = String(params.get('awayAbbr') || '').trim().toUpperCase();
  if (!slotId || !day || !homeAbbr || !awayAbbr) return false;
  const slots = window.RosterBateHistoricalUniverseSlots;
  const adapterApi = window.RosterBateSimulationSeasonAdapter;
  if (!slots || !adapterApi || typeof slots.getState !== 'function' || typeof adapterApi.createSimulationSeasonAdapter !== 'function') return false;
  const state = slots.getState(slotId);
  if (!state) return false;
  liveMatchupMode = true;
  liveMatchupSlotId = slotId;
  liveMatchupReturnUrl = String(params.get('returnUrl') || '').trim() || 'rosterbate-season.html';
  liveMatchupEmbedded = params.get('embedded') === '1';
  liveMatchupAutoFinishDayOnReturn = params.get('autoFinishDayOnReturn') === '1';
  liveMatchupAdapter = adapterApi.createSimulationSeasonAdapter({ slotId, state });
  liveMatchupPrepared = liveMatchupAdapter.prepareLiveMatchup({ day, homeAbbr, awayAbbr });
  const game = liveMatchupPrepared?.gameLog || {};
  if (!game) return false;

  scoreA = 0; scoreB = 0;
  quarter = 1; clockSec = 12*60;
  paused = false; gameOver = false;
  playCount = 0; liveRevealIndex = 0; liveRevealSecondHalfIndex = 0;
  liveCommitted = false;
  liveCourtPossessionSide = 'A';
  liveCourtMotionState = window.RosterBateLiveCourtMotion?.createLiveMotionState
    ? window.RosterBateLiveCourtMotion.createLiveMotionState({ possessionSide: 'A' })
    : { possessionSide: 'A', phase: 'transition', sequence: 0 };
  liveCourtTicksSinceFrame = 0;
  liveBall._x = 300; liveBall._y = 200; liveBall._targetX = 300; liveBall._targetY = 200;
  moveBall(300, 200);
  setBallVisible(true);
  teamA = (Array.isArray(game.homeEntries) ? game.homeEntries : []).map(entry => normalizeLiveEntry(entry, 'A', '#9333ea', 'purple'));
  teamB = (Array.isArray(game.awayEntries) ? game.awayEntries : []).map(entry => normalizeLiveEntry(entry, 'B', '#0284c7', 'cyan'));
  document.getElementById('team-a-name').textContent = game.homeName || homeAbbr;
  document.getElementById('team-b-name').textContent = game.awayName || awayAbbr;
  document.getElementById('panel-a-header').textContent = game.homeName || homeAbbr;
  document.getElementById('panel-b-header').textContent = game.awayName || awayAbbr;
  document.getElementById('btn-reveal-final').style.display = 'inline-flex';
  buildRosterPanel(teamA, 'roster-a', 'purple');
  buildRosterPanel(teamB, 'roster-b', 'cyan');
  clearCourt();
  createDots(teamA, 'A', '#9333ea', 'purple');
  createDots(teamB, 'B', '#0284c7', 'cyan');
  document.getElementById('pbp-body').innerHTML = '';
  document.getElementById('pbp-count').textContent = '0 plays';
  const homeScoreTarget = Number(game.homeScore ?? game.homeTotal ?? 0) || 0;
  const awayScoreTarget = Number(game.awayScore ?? game.awayTotal ?? 0) || 0;
  const homeReveal = splitLiveRevealEventsByHalf(buildLiveRevealEvents(teamA, 'A', homeScoreTarget));
  const awayReveal = splitLiveRevealEventsByHalf(buildLiveRevealEvents(teamB, 'B', awayScoreTarget));
  if (window.RosterBateLiveRevealEngine && typeof window.RosterBateLiveRevealEngine.interleaveLiveRevealHalfEvents === 'function') {
    liveRevealFirstHalfEvents = window.RosterBateLiveRevealEngine.interleaveLiveRevealHalfEvents(homeReveal.first, awayReveal.first);
    liveRevealSecondHalfEvents = window.RosterBateLiveRevealEngine.interleaveLiveRevealHalfEvents(homeReveal.second, awayReveal.second);
  } else {
    liveRevealFirstHalfEvents = homeReveal.first.concat(awayReveal.first).sort(() => Math.random() - 0.5);
    liveRevealSecondHalfEvents = homeReveal.second.concat(awayReveal.second).sort(() => Math.random() - 0.5);
  }
  liveRevealEvents = liveRevealFirstHalfEvents.concat(liveRevealSecondHalfEvents);
  liveRevealFirstHalfInterval = Math.max(16, Math.min(42, (24 * 60) / Math.max(1, liveRevealFirstHalfEvents.length + 2)));
  liveRevealSecondHalfInterval = Math.max(16, Math.min(42, (24 * 60) / Math.max(1, liveRevealSecondHalfEvents.length + 2)));
  liveRevealInterval = liveRevealFirstHalfInterval;
  if (liveMatchupPrepared.status === 'completed') {
    scoreA = homeScoreTarget;
    scoreB = awayScoreTarget;
    teamA.forEach(player => { player._fp = player._targetFp; updatePlayerFP(player); });
    teamB.forEach(player => { player._fp = player._targetFp; updatePlayerFP(player); });
    gameOver = true;
    commitLiveMatchupResult();
    showOverlay('FINAL', true, homeScoreTarget >= awayScoreTarget ? (game.homeName || homeAbbr) : (game.awayName || awayAbbr));
  }
  updateScoreboard();
  return true;
}

// ── Main sim tick ──────────────────────────────────────────────────────────
let ticksSincePossession = 0;

function simTick() {
  if (paused || gameOver) return;
  animateDots();

  const simStep = SIM_SECS * speed;
  clockSec -= simStep;
  ticksSincePossession += simStep;
  liveCourtTicksSinceFrame += 1;

  if (liveMatchupMode) {
    if (liveCourtTicksSinceFrame >= 7) {
      liveCourtTicksSinceFrame = 0;
      applyLiveCourtMotionForEvent(null);
    }
    liveRevealInterval = quarter <= 2 ? liveRevealFirstHalfInterval : liveRevealSecondHalfInterval;
    if (ticksSincePossession >= liveRevealInterval) {
      ticksSincePossession = 0;
      liveCourtTicksSinceFrame = 0;
      const event = quarter <= 2
        ? liveRevealFirstHalfEvents[liveRevealIndex++]
        : liveRevealSecondHalfEvents[liveRevealSecondHalfIndex++];
      if (event) applyLiveRevealEvent(event);
    }
    if (clockSec <= 0) endQuarter();
    updateScoreboard();
    return;
  }

  // Run a possession every ~18 sim seconds — gives dots time to visibly travel
  const possessionInterval = 18;
  if (ticksSincePossession >= possessionInterval) {
    ticksSincePossession = 0;

    const offTeam = possession === 'A' ? teamA : teamB;
    const defTeam = possession === 'A' ? teamB : teamA;

    // Pick ball-handler first so we can aim them at the paint during setup
    const offWeightsSetup = offTeam.slice(0,5).map(p=>({value:p, weight:p.fp}));
    const setupBallHandler = weightedRandom(offWeightsSetup);
    setOffensePositions(offTeam, setupBallHandler._id);
    setDefensePositions(defTeam);

    runPossession(offTeam, defTeam);
  }

  // Occasional idle drift for off-ball players
  if (Math.random() < 0.05) {
    const all = [...teamA.slice(0,5), ...teamB.slice(0,5)];
    setRandomTarget(pick(all));
  }

  if (clockSec <= 0) endQuarter();
  updateScoreboard();
}

function jitter(val, spread) { return val + rnd(-spread, spread); }

// Real NBA shot zones mapped to this SVG (600×400):
// Right basket: x=545,y=200  Right key: x=460–580,y=130–270
// Left  basket: x=55, y=200  Left  key: x=20–140, y=130–270
// 3pt arc peaks: x≈400 (right), x≈200 (left)
// Corners (baseline 3): right=(565,y=35 or y=365), left=(35,y=35 or y=365)
// Wings (3pt arc):      right=(490,y=110 or y=290), left=(110,y=110 or y=290)
// Top of key (3pt):     right=(390,y=200), left=(210,y=200)
// Elbows (FT line ext): right=(460,y=150 or y=250), left=(140,y=150 or y=250)
// Short mid-range:      right=(500,y=170 or y=230), left=(100,y=170 or y=230)
// Paint / low post:     right=(530,y=175 or y=225), left=(70,y=175 or y=225)
// Restricted area:      right=(548,y=195–205), left=(52,y=195–205)

function snapPlayer(p, x, y) {
  // Set a glide target for off-ball repositioning.
  setCourtTarget(p, x, y, 13);
}

function setOffensePositions(offTeam, ballHandlerId) {
  // ALL players snap instantly so the court looks right before the next possession fires.
  // Ball-handler snaps to paint/post area; off-ball to perimeter spacing.
  const paintSpotsR = [
    {x:jitter(530,10), y:jitter(175,10)},  // low post hi
    {x:jitter(530,10), y:jitter(225,10)},  // low post lo
    {x:jitter(505,8),  y:jitter(200,12)},  // mid-paint
    {x:jitter(490,8),  y:jitter(160,10)},  // elbow hi
    {x:jitter(490,8),  y:jitter(240,10)},  // elbow lo
  ];
  const paintSpotsL = [
    {x:jitter(70,10),  y:jitter(175,10)},
    {x:jitter(70,10),  y:jitter(225,10)},
    {x:jitter(95,8),   y:jitter(200,12)},
    {x:jitter(110,8),  y:jitter(160,10)},
    {x:jitter(110,8),  y:jitter(240,10)},
  ];
  const paintSpots = attackingRight ? paintSpotsR : paintSpotsL;
  const ballSpot = paintSpots[Math.floor(Math.random() * paintSpots.length)];

  const spacingR = [
    {x:jitter(430,12), y:jitter(105,12)},  // wing hi (3pt arc)
    {x:jitter(430,12), y:jitter(295,12)},  // wing lo (3pt arc)
    {x:jitter(545,6),  y:jitter(65,12)},   // corner hi
    {x:jitter(545,6),  y:jitter(335,12)},  // corner lo
  ];
  const spacingL = [
    {x:jitter(170,12), y:jitter(105,12)},
    {x:jitter(170,12), y:jitter(295,12)},
    {x:jitter(55,6),   y:jitter(65,12)},
    {x:jitter(55,6),   y:jitter(335,12)},
  ];
  const spacing = attackingRight ? spacingR : spacingL;
  let si = 0;
  offTeam.slice(0,5).forEach(p => {
    if (p._id === ballHandlerId) {
      snapPlayer(p, ballSpot.x, ballSpot.y);
    } else {
      const s = spacing[si++];
      snapPlayer(p, s.x, s.y);
    }
  });
}

function setDefensePositions(defTeam) {
  // Defenders SNAP into the paint in front of the basket immediately.
  // Right basket: x=460-580, y=130-270  →  defenders pack x=465-530
  // Left  basket: x=20-140,  y=130-270  →  defenders pack x=70-135
  const spotsR = [
    {x:jitter(528,6),  y:jitter(200,6)},   // C   — deepest in paint
    {x:jitter(510,6),  y:jitter(163,8)},   // PF  — block hi
    {x:jitter(510,6),  y:jitter(237,8)},   // SF  — block lo
    {x:jitter(480,8),  y:jitter(145,10)},  // SG  — elbow hi
    {x:jitter(480,8),  y:jitter(255,10)},  // PG  — elbow lo
  ];
  const spotsL = [
    {x:jitter(72,6),   y:jitter(200,6)},
    {x:jitter(90,6),   y:jitter(163,8)},
    {x:jitter(90,6),   y:jitter(237,8)},
    {x:jitter(120,8),  y:jitter(145,10)},
    {x:jitter(120,8),  y:jitter(255,10)},
  ];
  const spots = attackingRight ? spotsR : spotsL;
  defTeam.slice(0,5).forEach((p,i) => snapPlayer(p, spots[i].x, spots[i].y));
}

function endQuarter() {
  if (quarter === 2) {
    // Halftime
    pauseSim();
    showOverlay('HALFTIME', false);
  } else if (quarter === 4) {
    // Game over
    pauseSim();
    gameOver = true;
    if (liveMatchupMode) finalizeLiveMatchupReveal();
    const winner = scoreA > scoreB ? document.getElementById('team-a-name').textContent : document.getElementById('team-b-name').textContent;
    showOverlay('FINAL', true, winner);
  } else {
    quarter++;
    clockSec = 12 * 60;
    addQuarterBreakPBP();
  }
}

function finalizeLiveMatchupReveal() {
  const game = liveMatchupPrepared?.gameLog || {};
  scoreA = Number(game.homeScore ?? game.homeTotal ?? scoreA) || scoreA;
  scoreB = Number(game.awayScore ?? game.awayTotal ?? scoreB) || scoreB;
  teamA.forEach(player => { player._fp = Number(player._targetFp || player._fp || 0); updatePlayerFP(player); });
  teamB.forEach(player => { player._fp = Number(player._targetFp || player._fp || 0); updatePlayerFP(player); });
  updateScoreboard();
  commitLiveMatchupResult();
}

function revealLiveFinal() {
  if (!liveMatchupMode || gameOver) return;
  pauseSim();
  while (liveRevealIndex < liveRevealFirstHalfEvents.length) {
    const event = liveRevealFirstHalfEvents[liveRevealIndex++];
    if (event) applyLiveRevealEvent(event);
  }
  while (liveRevealSecondHalfIndex < liveRevealSecondHalfEvents.length) {
    const event = liveRevealSecondHalfEvents[liveRevealSecondHalfIndex++];
    if (event) applyLiveRevealEvent(event);
  }
  quarter = 4;
  clockSec = 0;
  gameOver = true;
  finalizeLiveMatchupReveal();
  const game = liveMatchupPrepared?.gameLog || {};
  const winnerSide = String(game?.winner || '').trim().toLowerCase();
  const winner = winnerSide === 'away'
    ? document.getElementById('team-b-name').textContent
    : winnerSide === 'home'
      ? document.getElementById('team-a-name').textContent
      : scoreA >= scoreB
        ? document.getElementById('team-a-name').textContent
        : document.getElementById('team-b-name').textContent;
  showOverlay('FINAL', true, winner);
}

function addQuarterBreakPBP() {
  const body = document.getElementById('pbp-body');
  const div = document.createElement('div');
  div.style.cssText='text-align:center;padding:6px;font-size:9px;color:var(--yellow);letter-spacing:2px;border-bottom:1px solid var(--border)';
  div.textContent = `── END OF Q${quarter-1} ──`;
  body.prepend(div);
}

// ── Overlay ────────────────────────────────────────────────────────────────
function showOverlay(title, isFinal, winner='') {
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('ov-score-a').textContent = fmt(scoreA);
  document.getElementById('ov-score-b').textContent = fmt(scoreB);
  document.getElementById('ov-name-a').textContent = document.getElementById('team-a-name').textContent;
  document.getElementById('ov-name-b').textContent = document.getElementById('team-b-name').textContent;

  // Top scorer
  const all = [...teamA,...teamB].sort((a,b)=>b._fp-a._fp);
  const top = all[0];
  document.getElementById('overlay-top-player').textContent =
    top ? `🏆 Top scorer: ${top.name} — ${fmt(top._fp)} FPTS` : '';

  const btn = document.getElementById('overlay-btn');
  const sub = document.getElementById('overlay-sub');
  if (isFinal) {
    document.getElementById('btn-reveal-final').style.display = 'none';
    btn.textContent = liveMatchupMode ? 'Return to Season' : '↺ New Game';
    btn.onclick = liveMatchupMode ? (() => {
      if (liveMatchupEmbedded && window.parent && window.parent !== window) {
        window.parent.postMessage({ type:'rosterbate-live-matchup-return', slotId:liveMatchupSlotId }, window.location.origin);
        return;
      }
      stageLiveMatchupReturnIntent();
      window.location.href = liveMatchupReturnUrl || 'rosterbate-season.html';
    }) : startNewGame;
    sub.textContent = winner ? `${winner} win!` : '';
  } else {
    btn.textContent = liveMatchupMode ? 'Reveal 2nd Half' : '▶ 2nd Half';
    btn.onclick = resumeSim;
    sub.textContent = liveMatchupMode
      ? 'The official result is locked. Reveal the closing run.'
      : '';
  }
}

function resumeSim() {
  document.getElementById('overlay').classList.add('hidden');
  if (!gameOver) {
    quarter++;
    clockSec = 12 * 60;
    ticksSincePossession = 0;
    paused = false;
    document.getElementById('btn-pause').textContent = '⏸ Pause';
  }
}

// ── Controls ───────────────────────────────────────────────────────────────
function pauseSim() {
  paused = true;
  document.getElementById('btn-pause').textContent = '▶ Resume';
}

function togglePause() {
  if (gameOver) return;
  paused = !paused;
  document.getElementById('btn-pause').textContent = paused ? '▶ Resume' : '⏸ Pause';
}

function setSpeed(s) {
  speed = s;
  document.getElementById('speed-1x').classList.toggle('active', s===1);
  document.getElementById('speed-3x').classList.toggle('active', s===3);
  document.getElementById('speed-5x').classList.toggle('active', s===5);
}

// ── Start / reset ──────────────────────────────────────────────────────────
let _idCounter = 0;
function assignId(player) { player._id = ++_idCounter; player._fp = 0; return player; }

function clearCourt() {
  document.getElementById('player-dots').innerHTML = '';
  const shotMarkers = document.getElementById('shot-markers');
  if (shotMarkers) shotMarkers.innerHTML = '';
  Object.keys(dotEls).forEach(k => delete dotEls[k]);
}

function startNewGame() {
  // Close overlay
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('btn-reveal-final').style.display = 'none';

  // Reset state
  scoreA = 0; scoreB = 0;
  quarter = 1; clockSec = 12*60;
  paused = false; gameOver = false;
  playCount = 0;
  liveRevealIndex = 0;
  liveRevealSecondHalfIndex = 0;
  possession = Math.random() < 0.5 ? 'A' : 'B';
  attackingRight = Math.random() < 0.5;  // random tip-off direction
  ticksSincePossession = 0;
  liveCourtMotionState = null;
  liveCourtTicksSinceFrame = 0;
  liveBall._x = 300; liveBall._y = 200; liveBall._targetX = 300; liveBall._targetY = 200;
  moveBall(300, 200);
  setBallVisible(false);

  // Pick teams
  const [a, b] = pickTeams();
  teamA = a.map(p => assignId({...p}));
  teamB = b.map(p => assignId({...p}));

  // Names (use top player's team)
  const nameA = ['Purple Rain','Slam Dunk City','The Buckets','Rim Rockers'][Math.floor(Math.random()*4)];
  const nameB = ['Ice Cold','Net Ninjas','Fast Break FC','Hoop Dreams'][Math.floor(Math.random()*4)];
  document.getElementById('team-a-name').textContent = nameA;
  document.getElementById('team-b-name').textContent = nameB;
  document.getElementById('panel-a-header').textContent = nameA;
  document.getElementById('panel-b-header').textContent = nameB;

  // Build rosters
  buildRosterPanel(teamA, 'roster-a', 'purple');
  buildRosterPanel(teamB, 'roster-b', 'cyan');

  // Build court dots
  clearCourt();
  createDots(teamA, 'A', '#9333ea', 'purple');
  createDots(teamB, 'B', '#0284c7', 'cyan');

  // Clear PBP
  document.getElementById('pbp-body').innerHTML = '';
  document.getElementById('pbp-count').textContent = '0 plays';

  // Reset scoreboard
  updateScoreboard();

  document.getElementById('btn-pause').textContent = '⏸ Pause';
}

// ── Init ───────────────────────────────────────────────────────────────────
if (!bootLiveMatchupFromParams()) startNewGame();
loadLivePortraitManifest();
simInterval = setInterval(simTick, TICK_MS);
</script>
